[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paicli-python"
version = "0.1.0"
description = "A bounded Python coding agent and AI platform operations CLI"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<0.29"]

[project.scripts]
paicli = "paicli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
