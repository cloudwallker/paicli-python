name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: paicli demo --json
  platform-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cloudwallker/flowtrail-python
          ref: 9249d59135009434229ba4525f124c53e5553ff8
          path: .integration-flowtrail
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . ./.integration-flowtrail
      - run: python scripts/integration_flowtrail.py --flowtrail-src .integration-flowtrail/src
